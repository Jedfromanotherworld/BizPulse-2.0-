name: Android APK and tests
on:
  push:
    branches: [main]
    paths-ignore: ['Documentation/**', '*.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android tools
        run: |
          python3 - <<'PY'
          import os,pathlib,urllib.request,zipfile,subprocess,shutil
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'android-sdk'
          root.mkdir(exist_ok=True)
          archive=root/'tools.zip'
          urllib.request.urlretrieve('https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip',archive)
          with zipfile.ZipFile(archive) as z:z.extractall(root/'unpacked')
          (root/'cmdline-tools').mkdir(exist_ok=True)
          shutil.move(str(root/'unpacked/cmdline-tools'),str(root/'cmdline-tools/latest'))
          for p in (root/'cmdline-tools/latest/bin').iterdir():p.chmod(0o755)
          cmd=[str(root/'cmdline-tools/latest/bin/sdkmanager'),'--sdk_root='+str(root)]
          subprocess.run(cmd+['--licenses'],input='y\n'*100,text=True,check=True)
          subprocess.run(cmd+['platforms;android-34','build-tools;34.0.0','ndk;27.2.12479018','cmake;3.22.1'],check=True)
          pathlib.Path('local.properties').write_text('sdk.dir='+str(root)+'\n')
          PY
      - name: Download verified offline AI model
        run: python3 scripts/download_model.py
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest assembleDebugAndroidTest --no-daemon --max-workers=2
      - name: Upload APK and reports
        uses: actions/upload-artifact@v7
        with:
          name: BizPulse-2.0-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/testDebugUnitTest/
          compression-level: 0
          retention-days: 14
  publish:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release v2.0.0]')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Download tested build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name BizPulse-2.0-debug --dir release-artifact
      - name: Publish approved APK and payment QR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp release-artifact/outputs/apk/debug/app-debug.apk BizPulse-2.0.0-arm64-debug.apk
          cp app/src/main/res/drawable/owner_qr.png BizPulse-payment-QR.jpg
          sha256sum BizPulse-2.0.0-arm64-debug.apk BizPulse-payment-QR.jpg > SHA256SUMS.txt
          gh release create v2.0.0 --target "$GITHUB_SHA" --title "BizPulse 2.0.0" --notes-file RELEASE-NOTES.md BizPulse-2.0.0-arm64-debug.apk BizPulse-payment-QR.jpg SHA256SUMS.txt
